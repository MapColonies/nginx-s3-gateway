global:
  cloudProvider: {}
  tracing: {}
  metrics: {}
  environment: ''
  allowDirectoryList: false

splunkIndex: ''

authorization:
  enabled: false
  domain: dem
  url:

image:
  repository: nginx-s3-gateway
  tag: v3.0.2

enabled: true
environment: production
initialDelaySeconds: 10
nodePort: 30030
replicaCount: 1
cloudProvider:
  dockerRegistryUrl: acrarolibotnonprod.azurecr.io
  imagePullSecretName: acr-registry
  flavor: openshift

env:
  protocol: TCP
  port: 80
  targetPort: 8080
  tracing:
    enabled: false
    url: http://localhost:55681/v1/traces
  metrics:
    enabled: false
    url: http://localhost:55681/v1/metrics

resources:
  enabled: true
  value:
    limits:
      cpu: 500m
      memory: 900Mi
    requests:
      cpu: 125m
      memory: 900Mi

ingress:
  enabled: false
  type: nginx-kubernetes # supported values: 'nginx-org' | 'nginx-kubernetes'
  host:
  path: /

route:
  enabled: true
  host:
  path: /
  tls:
    enabled: true
    useCert: true

s3:
  bucketName: dem-int
  accessKeyId: raster
  secretAccessKey: rasterPassword
  server: 10.8.0.9
  serverPort: 9000
  serverProto: http
  region: us-east-1
  style: path
  debug: true
  corsEnabled: true
  nginxWorkerProcesses: 4
  cacheMaxSize: 10g
  cacheInactive: 60m
  cacheValidOk: 1h
  cacheValidNotfound: 1m
  cacheValidForbidden: 30s
  # Object HEADed by the readiness probe to verify S3 reachability. Must exist in the bucket.
  readinessObject: liveness.txt
  # customServerConf:
  # customLocationConf:
  # sigsVersion: 4
  # allowDirectoryList: false

aws:
  sigsVersion: 4

opa:
  image: openpolicyagent/opa
  imageTag: 0.29.4-envoy-3
  port: 9191
  resources:
    enabled: true
    value:
      limits:
        cpu: 400m
        memory: 200Mi
      requests:
        cpu: 100m
        memory: 200Mi

envoy:
  image: envoyproxy/envoy
  imageTag: v1.20.7
  port: 6565
  maxRequestBytes: 8192
  requestedDomain: dem
  resources:
    enabled: true
    value:
      limits:
        cpu: 500m
        memory: 900Mi
      requests:
        cpu: 125m
        memory: 900Mi

logsFilebeat:
  enabled: false
  filebeatImage: docker.elastic.co/beats/filebeat:7.12.1
  mountPath: /var/log/nginx
