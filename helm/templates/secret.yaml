{{- $s3 := include "nginx-s3-gateway.s3Credentials" . | fromYaml }}
{{- if $s3.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "nginx-s3-gateway.secretName" . }}
  labels:
{{- include "nginx-s3-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  accessKeyId: {{ $s3.accessKeyId | b64enc | quote }}
  secretAccessKey: {{ $s3.secretAccessKey | b64enc | quote }}
{{- end }}
