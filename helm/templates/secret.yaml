{{- if .Values.s3.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "nginx-s3-gateway.secretName" . }}
  labels:
{{- include "nginx-s3-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  accessKeyId: {{ .Values.s3.accessKeyId | b64enc | quote }}
  secretAccessKey: {{ .Values.s3.secretAccessKey | b64enc | quote }}
{{- end }}
