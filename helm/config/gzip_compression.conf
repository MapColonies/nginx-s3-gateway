{{- $gzip := .Values.gzip | default dict -}}

gzip {{ if $gzip.enabled }}on{{ else }}off{{ end }};
{{- if $gzip.enabled }}

gzip_comp_level {{ $gzip.compLevel | default 6 }};

gzip_min_length {{ $gzip.minLength | default 256 }};

gzip_proxied {{ $gzip.proxied | default "any" }};

gzip_vary {{ $gzip.vary | default "on" }};

gzip_types
{{- range ($gzip.types | default (list
  "application/json"
  "application/geo+json"
  "application/octet-stream"
  "model/gltf+json"
  "model/gltf-binary"
)) }}
  {{ . }}
{{- end }};
{{- end }}
