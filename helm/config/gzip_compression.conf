{{- $gzip := .Values.gzip | default dict -}}

gzip {{ if $gzip.enabled }}on{{ else }}off{{ end }};
{{- if $gzip.enabled }}

gzip_comp_level {{ $gzip.compLevel | default 5 }};

gzip_min_length {{ if hasKey $gzip "minLength" }}{{ $gzip.minLength }}{{ else }}256{{ end }};

gzip_proxied {{ if kindIs "bool" $gzip.proxied }}{{ if $gzip.proxied }}any{{ else }}off{{ end }}{{ else }}{{ $gzip.proxied | default "any" }}{{ end }};

gzip_vary {{ if kindIs "bool" $gzip.vary }}{{ if $gzip.vary }}on{{ else }}off{{ end }}{{ else }}{{ $gzip.vary | default "on" }}{{ end }};

{{/* excluded on purpose: application/octet-stream, model/gltf-binary
     (.b3dm/.glb) - tile payloads are mostly already-compressed textures,
     gzip gains little and burns CPU. Add via gzip.types override if needed. */ -}}
gzip_types
{{- range ($gzip.types | default (list
  "application/geo+json"
  "application/json"
  "image/svg+xml"
  "model/gltf+json"
  "text/css"
  "text/javascript"
  "text/plain"
  "text/xml"
)) }}
  {{ . }}
{{- end }};
{{- end }}
