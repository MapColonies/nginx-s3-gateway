services:
  nginx-s3-gateway:
    build:
      context: ../
      args:
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE}
    env_file:
      - .env
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./log_format.conf:/etc/nginx/log_format.conf:ro
    ports:
      - 8080:8080
    depends_on:
      - s3

  s3:
    image: localstack/localstack:3
    ports:
      - 4566:4566
    environment:
      - SERVICES=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DEFAULT_REGION=${S3_REGION}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  createBucketAndObjectsOnS3:
    image: amazon/aws-cli:2.17.62
    volumes:
      - ./minioData:/mnt/minioData:ro
    depends_on:
      s3:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AWS_DEFAULT_REGION=${S3_REGION}
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://s3:4566 s3 mb s3://${S3_BUCKET_NAME};
      aws --endpoint-url=http://s3:4566 s3 cp --recursive /mnt/minioData s3://${S3_BUCKET_NAME}/;
      "
