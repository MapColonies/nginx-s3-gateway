name: PR checks

on:
  pull_request:
    branches: [master]

env:
  HELM_EXPERIMENTAL_OCI: 1

jobs:
  njs-unit-tests:
    name: njs unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/test-njs.sh defaults to the public nginxinc/nginx-s3-gateway
      # image - the same one Dockerfile stage 1 copies /etc/nginx/include from -
      # so this needs no registry credentials and works on fork PRs.
      - name: Run njs unit tests
        run: ./scripts/test-njs.sh

  example-config-drift:
    name: example/ config is in sync with helm/config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install PyYAML
        run: pip install pyyaml

      # helm refuses to render while a declared dependency is missing from
      # charts/ - even though the template we render (custom-configmap.yaml)
      # never uses mclabels - so the chart has to come from the private ACR
      # first. Pull-only credentials: this job only reads a chart, it never
      # pushes. Fork PRs get no secrets and will fail here.
      #
      # The logout matters: the next step runs a script from the PR branch, and
      # it must not find a registry credential sitting on disk.
      - name: Fetch the mclabels chart dependency
        run: |
          helm registry login "${{ secrets.ACR_URL }}" \
            --username "${{ secrets.ACR_PULL_USER }}" \
            --password "${{ secrets.ACR_PULL_TOKEN }}"
          helm dependency build ./helm
          helm registry logout "${{ secrets.ACR_URL }}"

      - name: Check rendered example config
        env:
          SKIP_HELM_DEPENDENCY_BUILD: "1"
        run: ./scripts/render-example-config.sh --check
