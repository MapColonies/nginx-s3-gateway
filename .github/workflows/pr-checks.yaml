name: PR checks

on:
  pull_request:
    branches: [master]

env:
  HELM_EXPERIMENTAL_OCI: 1

jobs:
  njs-unit-tests:
    name: njs unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/test-njs.sh defaults to the public nginxinc/nginx-s3-gateway
      # image - the same one Dockerfile stage 1 copies /etc/nginx/include from -
      # so this needs no registry credentials and works on fork PRs.
      - name: Run njs unit tests
        run: ./scripts/test-njs.sh

  example-config-drift:
    name: example/ config is in sync with helm/config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install PyYAML
        run: pip install pyyaml

      # helm refuses to render while a declared dependency is missing from
      # charts/ - even though the template we render (custom-configmap.yaml)
      # never uses mclabels - so the chart has to come from the private ACR
      # first. This job only reads a chart, so it wants pull-only credentials;
      # it falls back to the push token until ACR_PULL_* secrets exist, because
      # an empty username makes `helm registry login` prompt and die on EOF.
      #
      # The logout is what actually contains the credential: the next step runs
      # a script from the PR branch, and must not find a login sitting on disk.
      # That holds whichever of the two tokens was used.
      - name: Fetch the mclabels chart dependency
        env:
          ACR_URL: ${{ secrets.ACR_URL }}
          ACR_USER: ${{ secrets.ACR_PULL_USER || secrets.ACR_PUSH_USER }}
          ACR_TOKEN: ${{ secrets.ACR_PULL_TOKEN || secrets.ACR_PUSH_TOKEN }}
        run: |
          if [ -z "$ACR_USER" ] || [ -z "$ACR_TOKEN" ]; then
            echo "::error::No ACR credentials available. Fork PRs cannot run this check;" \
                 "on a branch PR, set ACR_PULL_USER and ACR_PULL_TOKEN."
            exit 1
          fi
          # --password-stdin keeps the token out of the process argument list.
          printf '%s' "$ACR_TOKEN" | helm registry login "$ACR_URL" \
            --username "$ACR_USER" --password-stdin
          helm dependency build ./helm
          helm registry logout "$ACR_URL"

      - name: Check rendered example config
        env:
          SKIP_HELM_DEPENDENCY_BUILD: "1"
        run: ./scripts/render-example-config.sh --check
